<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artifact Explorer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />

    <!-- GoatCounter. Prefixed so this app's pages are distinguishable from
         the other apps reporting to the same site. -->
    <script>
      window.goatcounter = {
        path: function (p) { return '/artifact-explorer' + p }
      }
    </script>
    <script data-goatcounter="https://bconnolly.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body class="calcite-mode-dark">
    <div id="loading-overlay">
      <div id="loading-content">
        <div id="loading-spinner"></div>
        <div id="loading-text">Loading...</div>
      </div>
    </div>
    <arcgis-scene
      id="sceneView"
      basemap="dark-gray-vector"
      environment-lighting-type="virtual"
      quality-profile="low"
    >
      <arcgis-home slot="top-left"></arcgis-home>
      <arcgis-zoom slot="top-left"></arcgis-zoom>
      <arcgis-navigation-toggle slot="top-left"></arcgis-navigation-toggle>
      <arcgis-compass slot="top-left"></arcgis-compass>
    </arcgis-scene>
    <div id="time-slider">
      <div id="time-labels">
        <span id="time-label-start"></span>
        <span id="time-label-end"></span>
      </div>
      <div id="time-track">
        <input type="range" id="time-min" />
        <input type="range" id="time-max" />
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
